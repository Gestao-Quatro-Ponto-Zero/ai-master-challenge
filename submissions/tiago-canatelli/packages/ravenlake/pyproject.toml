[project]
name = "ravenlake"
version = "0.1.0"
description = "Pipeline de ingestão do RavenStack Churn Lake (Kaggle MCP -> Supabase raw/bronze/silver)."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "typer>=0.12",
  "rich>=13.9",
  "mcp>=1.2",
  "httpx>=0.27",
  "supabase>=2.10",
]

[project.scripts]
ravenlake = "ravenlake.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
