<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Segunda-feira · o pipeline do vendedor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="tp-skip" href="#app">Ir para o conteúdo</a>
<header class="tp-bar">
  <p class="tp-brand">Segunda-feira</p>
  <nav class="tp-views" aria-label="Visão">
    <button type="button" id="view-seller" aria-pressed="true">Vendedor</button>
    <button type="button" id="view-manager" aria-pressed="false">Gestor</button>
  </nav>
  <form class="tp-filters" id="filters" onsubmit="return false">
    <label class="tp-team-filter">Região <select id="f-region"></select></label>
    <label class="tp-team-filter">Gestor <select id="f-manager"></select></label>
    <label id="l-seller"><select id="f-seller" aria-label="Vendedor"></select></label>
    <label><select id="f-monday" aria-label="Segunda-feira: a atual ou uma do passado"></select></label>
  </form>
  <button type="button" class="tp-btn" id="how-open" aria-haspopup="dialog">Como a ferramenta decide</button>
  <button type="button" class="tp-btn" id="theme" aria-pressed="false">Escuro</button>
</header>
<main id="app" tabindex="-1">
  <h1 class="tp-headline">Carregando o pipeline…</h1>
</main>
<footer class="tp-foot"><p id="foot-note"></p></footer>
<dialog id="how" class="tp-how" aria-labelledby="how-h"></dialog>
<div id="tip" class="tp-tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
