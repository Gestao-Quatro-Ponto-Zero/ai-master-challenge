<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/martian-mono@5.3.0/standard.css">
<style>
  html { background: #10283F; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Martian Mono Variable", ui-monospace, monospace;
    color: #E4ECF3;
    padding: 8vh 6vw;
    box-sizing: border-box;
  }
  p { margin: 0; }
  .id { font-size: clamp(40px, 8.5vw, 150px); font-weight: 200; font-stretch: 112.5%; letter-spacing: 0.02em; line-height: 1; }
  .rec {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 4ch;
    row-gap: 1.1em;
    margin-top: 7vh;
    max-width: 92ch;
    font-size: clamp(13px, 1vw, 16px);
    line-height: 1.5;
  }
  .k { color: #7FA2C2; font-stretch: 75%; font-weight: 400; text-transform: uppercase; letter-spacing: 0.14em; }
  .v { font-weight: 500; }
  .flag { color: #F2C14E; font-weight: 650; }
  .wide { grid-column: 1 / -1; margin-top: 2.5em; }
</style>
</head>
<body>
<main>
  <p class="k">Onde focar hoje</p>
  <p class="id">1LY8CAXD</p>
  <div class="rec">
    <p class="k">Segunda-feira</p><p class="v">Pipeline em 31/12/2017</p>
    <p class="k">GTK&nbsp;500</p><p class="v">Rosalina Dieter</p>
    <p class="k">Chance 71%</p><p class="v">Valor esperado US$&nbsp;18.948</p>
    <p class="k">Aberto há 95&nbsp;dias.</p><p class="v flag">Reta final.</p>
    <p class="k">Empurrar o fechamento:</p><p class="v">75% dos ganhos fecham até o 88º&nbsp;dia.</p>
    <p class="wide flag">1.291 deals parados há mais de 138&nbsp;dias</p>
    <p class="k">64% do valor do pipeline aberto</p>
  </div>
</main>
</body>
</html>
