<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/newsreader@5.3.0/standard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/newsreader@5.3.0/standard-italic.css">
<style>
  /* O vazio é o dado que falta: a maior parte da página fica em silêncio. */
  html { background: #F6F6F3; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Newsreader Variable", Georgia, serif;
    color: #2A2A28;
    box-sizing: border-box;
    padding: 6vh 6vw;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  p { margin: 0; }
  .meta { color: #9B9A94; font-size: 14px; font-style: italic; letter-spacing: 0.01em; }
  .col {
    align-self: end;
    justify-self: end;
    width: min(100%, 34ch);
    font-size: clamp(17px, 1.25vw, 21px);
    line-height: 1.5;
    font-variation-settings: "opsz" 16;
    padding-bottom: 4vh;
  }
  .ask { font-style: italic; color: #9B9A94; }
  .deal { font-size: 2.1em; line-height: 1.05; font-weight: 450; letter-spacing: -0.015em; margin-top: 0.4em; font-variation-settings: "opsz" 60; }
  .lead { margin-top: 0.3em; }
  .q { color: #9B9A94; }
  .gap { margin-top: 2.6em; }
  .act { font-style: italic; }
</style>
</head>
<body>
  <p class="meta">Segunda-feira, Pipeline em 31/12/2017</p>
  <main class="col">
    <p class="ask">Onde focar hoje</p>
    <p class="deal">GTK&nbsp;500</p>
    <p class="lead">Rosalina Dieter <span class="q">1LY8CAXD</span></p>
    <p>Aberto há 95&nbsp;dias. Reta final.</p>
    <p>Chance 71% <span class="q">·</span> Valor esperado US$&nbsp;18.948</p>
    <p class="gap act">Empurrar o fechamento: 75% dos ganhos fecham até o 88º&nbsp;dia.</p>
    <p class="gap q">1.291 deals parados há mais de 138&nbsp;dias.<br>64% do valor do pipeline aberto</p>
  </main>
</body>
</html>
