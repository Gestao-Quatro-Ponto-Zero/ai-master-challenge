<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/atkinson-hyperlegible-next@5.3.0/wght.css">
<style>
  /* Leitura de relance, entre reuniões, no celular: uma coisa por linha, números grandes. */
  html { background: #0B0B0C; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Atkinson Hyperlegible Next Variable", system-ui, sans-serif;
    color: #FFFFFF;
    padding: 5vh 6vw 7vh;
    box-sizing: border-box;
    max-width: 760px;
  }
  p { margin: 0; }
  .meta { color: #A4A4A8; font-size: 17px; font-weight: 500; }
  .ask { font-size: clamp(26px, 5vw, 40px); font-weight: 800; margin-top: 4vh; line-height: 1.1; }
  .deal { font-size: clamp(40px, 9vw, 76px); font-weight: 800; line-height: 1; margin-top: 3vh; letter-spacing: -0.01em; }
  .who { font-size: clamp(20px, 3.6vw, 28px); font-weight: 500; margin-top: 0.3em; }
  .who .id { color: #A4A4A8; margin-left: 0.5em; }
  .num { font-size: clamp(54px, 13vw, 112px); font-weight: 800; line-height: 0.95; margin-top: 4vh; font-variant-numeric: tabular-nums; }
  .num + .label, .label { color: #A4A4A8; font-size: clamp(18px, 3vw, 24px); font-weight: 500; }
  .val { font-size: clamp(26px, 5.4vw, 44px); font-weight: 700; margin-top: 2vh; }
  .act { color: #FFD23F; font-size: clamp(22px, 4.4vw, 34px); font-weight: 700; line-height: 1.2; margin-top: 4vh; }
  .act + .label { margin-top: 0.4em; color: #FFD23F; font-weight: 500; }
  .rest { color: #A4A4A8; font-size: 18px; font-weight: 500; margin-top: 7vh; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <p class="meta">Segunda-feira · Pipeline em 31/12/2017</p>
  <p class="ask">Onde focar hoje</p>
  <p class="deal">GTK&nbsp;500</p>
  <p class="who">Rosalina Dieter<span class="id">1LY8CAXD</span></p>
  <p class="num">Chance 71%</p>
  <p class="val">Valor esperado US$&nbsp;18.948</p>
  <p class="act">Aberto há 95&nbsp;dias. Reta final.</p>
  <p class="label">Empurrar o fechamento: 75% dos ganhos fecham até o 88º&nbsp;dia.</p>
  <p class="rest">1.291 deals parados há mais de 138&nbsp;dias<br>64% do valor do pipeline aberto</p>
</main>
</body>
</html>
