<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5.3.0/standard.css">
<style>
  html { background: #F5CE3E; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Bricolage Grotesque Variable", system-ui, sans-serif;
    color: #161412;
    padding: 4vh 3vw 5vh 3vw;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 3vh;
  }
  p { margin: 0; }
  .who { font-size: clamp(16px, 1.3vw, 22px); font-weight: 500; font-stretch: 90%; font-variation-settings: "opsz" 14; }
  .order {
    align-self: center;
    font-size: clamp(54px, 10.5vw, 190px);
    line-height: 0.86;
    font-weight: 780;
    font-stretch: 75%;
    letter-spacing: -0.04em;
    text-transform: lowercase;
    font-variation-settings: "opsz" 96;
  }
  .order .why {
    display: block;
    font-size: 0.26em;
    line-height: 1.1;
    font-weight: 420;
    letter-spacing: -0.01em;
    text-transform: none;
    font-stretch: 100%;
    max-width: 30ch;
    margin-top: 0.6em;
    font-variation-settings: "opsz" 24;
  }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1em 3em; font-size: clamp(14px, 1.05vw, 18px); font-weight: 460; font-variation-settings: "opsz" 12; }
  .foot p:last-child { text-align: right; }
</style>
</head>
<body>
  <p class="who">Segunda-feira — Onde focar hoje — Rosalina Dieter, GTK&nbsp;500, 1LY8CAXD</p>
  <p class="order">Empurrar o fechamento:<span class="why">75% dos ganhos fecham até o 88º&nbsp;dia. Aberto há 95&nbsp;dias. Reta final. Chance 71%. Valor esperado US$&nbsp;18.948</span></p>
  <div class="foot">
    <p>1.291 deals parados há mais de 138&nbsp;dias<br>64% do valor do pipeline aberto</p>
    <p>Pipeline em 31/12/2017</p>
  </div>
</body>
</html>
