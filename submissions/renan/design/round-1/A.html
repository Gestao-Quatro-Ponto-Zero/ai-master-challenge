<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/chivo-mono@5.3.0/wght.css">
<style>
  html { background: #F1ECE2; }
  body {
    margin: 0;
    min-height: 100vh;
    color: #1F1B16;
    font-family: "Chivo Mono Variable", ui-monospace, monospace;
    font-weight: 330;
    font-size: clamp(14px, 1.05vw + 8px, 17px);
    line-height: 1.55;
    font-variant-numeric: tabular-nums;
    padding: 11vh 7vw 14vh 13vw;
  }
  main { max-width: 38ch; }
  p { margin: 0; }
  .row { display: flex; justify-content: space-between; gap: 2ch; }
  .head { font-weight: 640; letter-spacing: 0.02em; }
  .quiet { font-weight: 260; }
  .gap-s { margin-top: 1.55em; }
  .gap-l { margin-top: 3.1em; }
  .total { font-weight: 760; font-size: 2.6em; line-height: 1.05; letter-spacing: -0.02em; }
  .indent { padding-left: 4ch; }
</style>
</head>
<body>
<main>
  <p class="row head"><span>Segunda-feira</span><span>Pipeline em 31/12/2017</span></p>
  <p class="quiet">Onde focar hoje</p>

  <p class="row gap-l"><span>1LY8CAXD</span><span>GTK&nbsp;500</span></p>
  <p class="row"><span class="indent">Rosalina Dieter</span><span></span></p>
  <p class="row"><span class="indent">Aberto há 95&nbsp;dias. Reta final.</span><span></span></p>
  <p class="row gap-s"><span>Valor esperado</span><span>US$&nbsp;18.948</span></p>

  <p class="row gap-s total"><span>Chance</span><span>71%</span></p>

  <p class="gap-l">Empurrar o fechamento: 75% dos ganhos fecham até o 88º&nbsp;dia.</p>

  <p class="gap-l quiet">1.291 deals parados há mais de 138&nbsp;dias</p>
  <p class="quiet indent">64% do valor do pipeline aberto</p>
</main>
</body>
</html>
