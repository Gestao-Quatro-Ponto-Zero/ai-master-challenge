<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.3.0/standard.css">
<style>
  html { background: #E7EAE3; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 6vh 4vw 8vh 4vw;
    font-family: "Archivo Variable", system-ui, sans-serif;
    color: #0C2316;
  }
  p {
    margin: 0;
    font-size: clamp(22px, 3.2vw, 54px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-wrap: pretty;
  }
  .noise {
    color: #8B9188;
    font-stretch: 62%;
    font-weight: 300;
    font-size: 0.62em;
    letter-spacing: 0.01em;
  }
  .signal {
    font-stretch: 125%;
    font-weight: 820;
  }
  .signal-mid {
    font-stretch: 110%;
    font-weight: 640;
  }
  .gap { display: block; height: 0.6em; }
</style>
</head>
<body>
<main>
  <p>
    <span class="noise">Segunda-feira · Pipeline em 31/12/2017 · Onde focar hoje · 1LY8CAXD ·</span>
    <span class="signal">GTK&nbsp;500</span>
    <span class="noise">Rosalina Dieter ·</span>
    <span class="signal-mid">Aberto há 95&nbsp;dias. Reta final.</span>
    <span class="noise">Chance 71% ·</span>
    <span class="signal">Valor esperado US$&nbsp;18.948</span>
    <span class="gap"></span>
    <span class="signal-mid">Empurrar o fechamento:</span>
    <span class="noise">75% dos ganhos fecham até o 88º&nbsp;dia.</span>
    <span class="gap"></span>
    <span class="signal">1.291 deals parados há mais de 138&nbsp;dias</span>
    <span class="noise">64% do valor do pipeline aberto</span>
  </p>
</main>
</body>
</html>
