<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@5.3.0/full.css">
<style>
  /* O peso cresce linha a linha, como a chance cresce enquanto o deal sobrevive. */
  html { background: #1E2A20; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fraunces Variable", Georgia, serif;
    color: #EEE6D0;
    padding: 9vh 6vw 10vh;
    box-sizing: border-box;
    text-align: center;
  }
  p { margin: 0 auto; max-width: 30ch; }
  .l { font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" var(--o); font-weight: var(--w); font-size: var(--s); line-height: 1.15; }
  .c2 { color: #B6C49A; }
  .sp { margin-top: 4vh; }
</style>
</head>
<body>
<main>
  <p class="l c2" style="--w: 120; --o: 9; --s: 15px">Segunda-feira · Pipeline em 31/12/2017</p>
  <p class="l c2 sp" style="--w: 180; --o: 18; --s: 19px; font-style: italic">Onde focar hoje</p>
  <p class="l sp" style="--w: 240; --o: 24; --s: 22px">1LY8CAXD · Rosalina Dieter</p>
  <p class="l" style="--w: 320; --o: 48; --s: clamp(34px, 4vw, 64px)">GTK&nbsp;500</p>
  <p class="l c2" style="--w: 400; --o: 24; --s: 22px">Aberto há 95&nbsp;dias. Reta final.</p>
  <p class="l sp" style="--w: 520; --o: 72; --s: clamp(54px, 9vw, 150px); line-height: 0.95">Chance 71%</p>
  <p class="l" style="--w: 620; --o: 30; --s: clamp(20px, 2vw, 32px)">Valor esperado US$&nbsp;18.948</p>
  <p class="l sp" style="--w: 760; --o: 36; --s: clamp(22px, 2.3vw, 38px)">Empurrar o fechamento: 75% dos ganhos fecham até o 88º&nbsp;dia.</p>
  <p class="l c2 sp" style="--w: 880; --o: 18; --s: 18px">1.291 deals parados há mais de 138&nbsp;dias</p>
  <p class="l c2" style="--w: 900; --o: 14; --s: 16px">64% do valor do pipeline aberto</p>
</main>
</body>
</html>
