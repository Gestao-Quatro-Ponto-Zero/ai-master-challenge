<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/literata@5.3.0/standard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/literata@5.3.0/standard-italic.css">
<style>
  html { background: #111827; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Literata Variable", Georgia, serif;
    color: #F3EADB;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 5vh 6vw 6vh 9vw;
    box-sizing: border-box;
  }
  p { margin: 0; }
  .top { color: #8E9AB3; font-size: 15px; letter-spacing: 0.04em; font-variation-settings: "opsz" 12; }
  .top span + span { margin-left: 2.5em; }
  .focus { align-self: center; padding: 6vh 0; }
  .ask { font-style: italic; color: #8E9AB3; font-size: clamp(18px, 1.6vw, 26px); font-variation-settings: "opsz" 24; }
  .who {
    font-size: clamp(56px, 10vw, 168px);
    line-height: 0.92;
    font-weight: 300;
    letter-spacing: -0.035em;
    font-variation-settings: "opsz" 72;
    margin-top: 0.15em;
  }
  .what { font-size: clamp(22px, 2.4vw, 40px); font-weight: 600; font-variation-settings: "opsz" 36; margin-top: 0.4em; }
  .what .id { color: #8E9AB3; font-weight: 400; margin-left: 0.6em; font-size: 0.6em; letter-spacing: 0.06em; }
  .act { color: #FF8B3D; font-size: clamp(20px, 2vw, 32px); font-weight: 500; max-width: 26ch; margin-top: 1.2em; line-height: 1.25; font-variation-settings: "opsz" 30; }
  .facts { margin-top: 1.4em; font-size: clamp(16px, 1.2vw, 20px); color: #F3EADB; }
  .facts span + span { margin-left: 2em; }
  .rest { color: #8E9AB3; font-size: 15px; font-variation-settings: "opsz" 12; max-width: 60ch; line-height: 1.6; }
</style>
</head>
<body>
  <p class="top"><span>Segunda-feira</span><span>Pipeline em 31/12/2017</span></p>
  <main class="focus">
    <p class="ask">Onde focar hoje</p>
    <p class="who">Rosalina Dieter</p>
    <p class="what">GTK&nbsp;500<span class="id">1LY8CAXD</span></p>
    <p class="act">Empurrar o fechamento: 75% dos ganhos fecham até o 88º&nbsp;dia.</p>
    <p class="facts"><span>Chance 71%</span><span>Valor esperado US$&nbsp;18.948</span><span>Aberto há 95&nbsp;dias. Reta final.</span></p>
  </main>
  <p class="rest">1.291 deals parados há mais de 138&nbsp;dias — 64% do valor do pipeline aberto</p>
</body>
</html>
