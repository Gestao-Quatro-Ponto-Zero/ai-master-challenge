[project]
name = "supportops"
version = "0.1.0"
description = "Diagnóstico e triagem assistida de suporte"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "streamlit==1.51.0",
    "threadpoolctl==3.8.0",
    "joblib==1.6.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["oficial: requer dados e artefatos oficiais locais"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
