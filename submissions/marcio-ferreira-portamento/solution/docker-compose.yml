version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ../dataset:/dataset  # Monta a pasta dataset que está fora da pasta solution para o backend acessar
    environment:
      - DATASET_DIR=/dataset

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
