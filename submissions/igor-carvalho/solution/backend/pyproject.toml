[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g4-lead-scorer"
version = "0.1.0"
description = "Treinamento do modelo de priorização de deals e API de score (somente leitura do modelo treinado)."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "pyarrow>=14",
  "pyjwt>=2.8",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "pydantic-settings>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "radon>=6", "ruff>=0.4"]

[project.scripts]
lead-trainer = "lead_trainer.cli:main"
lead-api = "lead_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_core = ["sql/*.sql", "sql/*.sha256"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: usa os dados reais e treina o modelo completo (~1-2 min)",
  "perf: testes de desempenho leves",
]
addopts = "-q -m 'not slow'"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
