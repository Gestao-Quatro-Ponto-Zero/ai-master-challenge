services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      RAVENSTACK_DATA_DIR: /app/data/raw
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      start_period: 15s
      retries: 3

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "8080:5173"
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 20s
      timeout: 3s
      start_period: 5s
      retries: 3
