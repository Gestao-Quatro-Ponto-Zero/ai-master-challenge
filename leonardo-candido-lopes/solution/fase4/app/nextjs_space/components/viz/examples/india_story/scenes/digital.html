<div class="as-split as-split-rev as-grow">
  <section data-tile="upi_volume" style="min-height:0"></section>
  <div>
    <p class="as-kicker as-in">The payments boom</p>
    <h2 class="as-h2 as-in" style="--d:100;margin-top:14px">UPI went from a pilot to the world's busiest payments rail.</h2>
    <div class="as-cols-2" style="margin-top:28px;gap:20px">
      <div class="as-stat as-stat-sm" data-step="1"><span class="as-stat-value" data-ab="counter" data-value="19.8" data-format="decimal" data-suffix=" bn">0</span><span class="as-stat-label">transactions a month</span></div>
      <div class="as-stat as-stat-sm" data-step="2"><span class="as-stat-value" data-ab="counter" data-value="480000000" data-format="integer">0</span><span class="as-stat-label">monthly active users</span></div>
      <div class="as-stat as-stat-sm" data-step="3"><span class="as-stat-value" data-ab="counter" data-value="0.82" data-format="percent">0</span><span class="as-stat-label">of digital payments by count</span></div>
      <div class="as-stat as-stat-sm" data-step="4"><span class="as-stat-value" data-ab="counter" data-value="0" data-prefix="₹" data-format="integer">0</span><span class="as-stat-label">fee per transaction</span></div>
    </div>
    <p class="as-small" style="margin-top:22px">Press → to reveal each figure. Illustrative data.</p>
  </div>
</div>
