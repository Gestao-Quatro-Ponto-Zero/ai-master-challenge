name: Felipe Social Media Quality

on:
  pull_request:
    paths:
      - "submissions/felipe-freire/**"
      - ".github/workflows/felipe-social-media.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/felipe-freire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: submissions/felipe-freire/pyproject.toml
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check dashboard src tests scripts
      - name: Format
        run: python -m ruff format --check dashboard src tests scripts
      - name: Contract-independent tests
        run: python -m pytest tests/unit tests/dashboard

  integration:
    runs-on: windows-latest
    if: ${{ vars.RUN_FULL_PIPELINE == 'true' }}
    defaults:
      run:
        working-directory: submissions/felipe-freire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip install kaggle
      - name: Download dataset
        shell: powershell
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          New-Item -ItemType Directory -Force data/raw | Out-Null
          kaggle datasets download -d omenkj/social-media-sponsorship-and-engagement-dataset -p data/raw
          Expand-Archive -Force data/raw/social-media-sponsorship-and-engagement-dataset.zip data/raw
      - name: End-to-end pipeline
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./src/etl/build_dataset.ps1
          python src/analysis/run_eda.py
          python src/analysis/run_inference.py
          python -m pytest
