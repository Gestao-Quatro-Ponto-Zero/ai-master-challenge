[project]
name = "churn-platform"
version = "0.1.0"
description = "Plataforma de Diagnóstico, Predição e Prescrição de Churn — SPEC-Driven"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lifelines>=0.27",
    "shap>=0.44",
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
churn = "churn_platform.run:cli"

[tool.setuptools.packages.find]
where = ["src"]
